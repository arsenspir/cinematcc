<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cinematcc</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10">
    <div class="max-w-6xl mx-auto">
        <!-- Header dengan Navigasi Panah yang Rapi -->
        <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8 bg-slate-900/50 border border-slate-800/80 p-6 rounded-2xl backdrop-blur">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Panel Admin Bioskop</h1>
                <p class="text-slate-400 text-sm mt-1">Kelola inventaris film, atur kapasitas kursi, dan pantau transaksi.</p>
            </div>
            <a href="/" class="inline-flex items-center gap-2 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 border border-slate-700/50 rounded-xl text-sm font-medium transition shadow-sm group">
                <svg class="w-4 h-4 transition-transform group-hover:-translate-x-1" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                Ke Beranda Utama
            </a>
        </header>

        <!-- Toast Notifikasi Custom -->
        <div id="toast" class="hidden fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-2xl border transition-all duration-300"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Kolom Kiri: Form Tambah Film -->
            <div class="bg-slate-900 border border-slate-800/80 rounded-2xl p-6 shadow-xl h-fit">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400 flex items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
                    Tambah Film Baru
                </h2>
                <form id="addMovieForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Judul Film</label>
                        <input type="text" id="movieTitle" required placeholder="Contoh: Interstellar" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Harga Tiket (Rp)</label>
                        <input type="number" id="moviePrice" required placeholder="50000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Jumlah Total Kursi</label>
                        <input type="number" id="movieSeats" required placeholder="30" value="30" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Pilih Berkas Poster (File Lokal)</label>
                        <input type="file" id="movieFile" accept="image/*" class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-slate-800 file:text-indigo-400 hover:file:bg-slate-700 cursor-pointer">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-medium text-sm transition shadow-lg shadow-indigo-600/20">
                        Simpan Film
                    </button>
                </form>
            </div>

            <!-- Kolom Kanan: Daftar Film & Daftar Booking -->
            <div class="lg:col-span-2 space-y-8">
                <!-- Tabel Daftar Film -->
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl">
                    <div class="p-5 border-b border-slate-800 font-semibold text-lg">Daftar Film Tersedia</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-800/40 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                    <th class="p-4">Judul</th>
                                    <th class="p-4">Harga</th>
                                    <th class="p-4">Kursi Tersisa</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="moviesTableBody" class="divide-y divide-slate-800/60 text-sm">
                                <tr><td colspan="4" class="p-6 text-center text-slate-400">Memuat data film...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Tabel Transaksi Booking -->
                <div class="bg-slate-900 border border-slate-800/80 rounded-2xl overflow-hidden shadow-xl">
                    <div class="p-5 border-b border-slate-800 font-semibold text-lg">Daftar Transaksi Pemesanan</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-800/40 text-slate-400 text-xs uppercase tracking-wider border-b border-slate-800">
                                    <th class="p-4">ID</th>
                                    <th class="p-4">Nama Pemesan</th>
                                    <th class="p-4">Film</th>
                                    <th class="p-4">Kursi</th>
                                    <th class="p-4">Total Harga</th>
                                    <th class="p-4 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody" class="divide-y divide-slate-800/60 text-sm">
                                <tr><td colspan="6" class="p-6 text-center text-slate-400">Memuat data pemesanan...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed top-5 right-5 z-50 px-4 py-3 rounded-xl text-sm font-medium shadow-2xl border transition-all duration-300 ${
                type === 'success' ? 'bg-emerald-950/90 border-emerald-500/50 text-emerald-200' : 'bg-red-950/90 border-red-500/50 text-red-200'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function fetchAdminData() {
            const moviesBody = document.getElementById('moviesTableBody');
            const bookingsBody = document.getElementById('bookingsTableBody');

            try {
                // Fetch Movies
                const resMovies = await fetch('/api/movies');
                const movies = await resMovies.json();
                if (movies.length === 0) {
                    moviesBody.innerHTML = `<tr><td colspan="4" class="p-6 text-center text-slate-400">Belum ada film.</td></tr>`;
                } else {
                    moviesBody.innerHTML = movies.map(m => `
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="p-4 font-medium">${m.title}</td>
                            <td class="p-4">Rp ${Number(m.price || 0).toLocaleString('id-ID')}</td>
                            <td class="p-4"><span class="px-2.5 py-1 bg-indigo-500/10 text-indigo-400 rounded-lg text-xs font-semibold">${m.seats !== undefined ? m.seats : (m.total_seats || 30)} Kursi</span></td>
                            <td class="p-4 text-center">
                                <button onclick="deleteMovie('${m.id}')" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-xs font-medium transition">Hapus</button>
                            </td>
                        </tr>
                    `).join('');
                }

                // Fetch Bookings
                const resBookings = await fetch('/api/bookings');
                const bookings = await resBookings.json();
                if (bookings.length === 0) {
                    bookingsBody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-slate-400">Belum ada data pemesanan.</td></tr>`;
                } else {
                    bookingsBody.innerHTML = bookings.map(b => `
                        <tr class="hover:bg-slate-800/30 transition">
                            <td class="p-4 font-mono text-xs text-slate-400">${b.id}</td>
                            <td class="p-4 font-medium">${b.customer_name || '-'}</td>
                            <td class="p-4">${b.movie_title || '-'}</td>
                            <td class="p-4"><span class="px-2 py-1 bg-indigo-500/10 text-indigo-400 rounded-lg text-xs font-semibold">${b.seats || '-'}</span></td>
                            <td class="p-4">Rp ${Number(b.total_price || 0).toLocaleString('id-ID')}</td>
                            <td class="p-4 text-center">
                                <button onclick="deleteBooking('${b.id}')" class="px-3 py-1.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-lg text-xs font-medium transition">Hapus</button>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                console.error("Gagal memuat data:", err);
            }
        }

        async function deleteMovie(id) {
            if (!confirm("Yakin ingin menghapus film ini?")) return;
            try {
                const res = await fetch(`/api/movies?id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Gagal menghapus film.");
                showToast("Film berhasil dihapus!");
                fetchAdminData();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        async function deleteBooking(id) {
            if (!confirm("Yakin ingin menghapus pesanan ini? Kursi akan dikembalikan ke film.")) return;
            try {
                const res = await fetch(`/api/bookings?id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Gagal menghapus pesanan.");
                showToast("Pesanan dihapus & kursi dikembalikan!");
                fetchAdminData();
            } catch (err) {
                showToast(err.message, 'error');
            }
        }

        document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('movieFile');
            let imageUrl = "https://via.placeholder.com/300x450?text=No+Image";

            const processSubmit = async (finalImageUrl) => {
                const newMovie = {
                    title: document.getElementById('movieTitle').value,
                    price: Number(document.getElementById('moviePrice').value),
                    seats: Number(document.getElementById('movieSeats').value),
                    image_url: finalImageUrl
                };

                submitBtn.disabled = true;
                submitBtn.textContent = "Menyimpan...";

                try {
                    const response = await fetch('/api/movies', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(newMovie)
                    });
                    if (!response.ok) throw new Error("Gagal menambah film.");
                    showToast("Film berhasil ditambahkan!");
                    document.getElementById('addMovieForm').reset();
                    fetchAdminData();
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Simpan Film";
                }
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => processSubmit(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSubmit(imageUrl);
            }
        });

        fetchAdminData();
    </script>
</body>
</html>
