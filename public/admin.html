<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Cinematcc</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">Panel Admin Bioskop</h1>
                <p class="text-slate-400 text-sm mt-1">Kelola film dan pantau transaksi pemesanan tiket.</p>
            </div>
            <a href="/" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition">← Ke Beranda Utama</a>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Kolom Kiri: Form Tambah Film -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl h-fit">
                <h2 class="text-lg font-semibold mb-4 text-indigo-400">Tambah Film Baru</h2>
                <form id="addMovieForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Judul Film</label>
                        <input type="text" id="movieTitle" required placeholder="Contoh: Interstellar" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Harga Tiket (Rp)</label>
                        <input type="number" id="moviePrice" required placeholder="50000" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">URL Poster Gambar</label>
                        <input type="url" id="movieImage" required placeholder="https://link-gambar.com/poster.jpg" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <button type="submit" id="submitBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-sm transition shadow-lg shadow-indigo-600/20">
                        Simpan Film
                    </button>
                </form>
            </div>

            <!-- Kolom Kanan: Daftar Transaksi Booking -->
            <div class="lg:col-span-2 space-y-8">
                <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl">
                    <div class="p-4 border-b border-slate-800 font-semibold text-lg flex justify-between items-center">
                        <span>Daftar Transaksi Pemesanan</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-800/50 text-slate-400 text-sm border-b border-slate-800">
                                    <th class="p-4">ID</th>
                                    <th class="p-4">Nama Pemesan</th>
                                    <th class="p-4">Film</th>
                                    <th class="p-4">Kursi</th>
                                    <th class="p-4">Total Harga</th>
                                    <th class="p-4">Waktu</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody" class="divide-y divide-slate-800 text-sm">
                                <tr>
                                    <td colspan="6" class="p-4 text-center text-slate-400">Memuat data pemesanan...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript -->
    <script>
        // 1. Fungsi Ambil Data Pemesanan
        async function fetchBookings() {
            const tableBody = document.getElementById('bookingsTableBody');
            try {
                const response = await fetch('/api/bookings');
                const contentType = response.headers.get("content-type");
                if (!contentType || !contentType.includes("application/json")) {
                    throw new Error("Endpoint API /api/bookings tidak ditemukan.");
                }

                const bookings = await response.json();
                if (!response.ok) throw new Error(bookings.error || "Gagal mengambil data.");

                if (bookings.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data pemesanan.</td></tr>`;
                    return;
                }

                tableBody.innerHTML = bookings.map(b => `
                    <tr class="hover:bg-slate-800/30 transition">
                        <td class="p-4 font-mono text-xs text-slate-400">${b.id}</td>
                        <td class="p-4 font-medium">${b.customer_name || '-'}</td>
                        <td class="p-4">${b.movie_title || '-'}</td>
                        <td class="p-4"><span class="px-2 py-1 bg-indigo-500/10 text-indigo-400 rounded text-xs font-semibold">${b.seats || '-'}</span></td>
                        <td class="p-4">Rp ${Number(b.total_price || 0).toLocaleString('id-ID')}</td>
                        <td class="p-4 text-slate-400 text-xs">${new Date(b.created_at).toLocaleString('id-ID')}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error("Error:", err);
                tableBody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-red-400">Gagal memuat data: ${err.message}</td></tr>`;
            }
        }

        // 2. Event Listener untuk Form Tambah Film
        document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            
            const newMovie = {
                title: document.getElementById('movieTitle').value,
                price: Number(document.getElementById('moviePrice').value),
                image_url: document.getElementById('movieImage').value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Menyimpan...";

            try {
                const response = await fetch('/api/movies', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newMovie)
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Gagal menambah film.");

                alert("Film berhasil ditambahkan!");
                document.getElementById('addMovieForm').reset();
            } catch (err) {
                alert("Terjadi kesalahan: " + err.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Simpan Film";
            }
        });

        // Jalankan saat halaman dimuat
        fetchBookings();
    </script>
</body>
</html>
