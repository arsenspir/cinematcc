\<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Kursi - CROSSCORN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .brutalist-card {
            background: #ffffff;
            border: 3px solid #000000;
            box-shadow: 8px 8px 0px #000000;
        }
        .brutalist-input {
            border: 2px solid #000000;
            background: #ffffff;
            transition: all 0.1s ease;
        }
        .brutalist-input:focus {
            outline: none;
            box-shadow: 3px 3px 0px #000000;
        }
        .brutalist-btn {
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s ease;
        }
        .brutalist-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0px #000000;
        }
        .brutalist-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        .curved-screen {
            border-top: 4px solid #000000;
            border-radius: 50% 50% 0 0 / 15px 15px 0 0;
        }
    </style>
</head>
<body class="bg-[#f4f4f0] text-black min-h-screen p-3 sm:p-6 flex items-center justify-center font-sans">
    <div id="toast" class="hidden fixed top-4 right-4 z-50 px-4 py-3 border-3 border-black shadow-[4px_4px_0px_#000] rounded-xl text-xs sm:text-sm font-black"></div>

    <div class="brutalist-card max-w-2xl w-full rounded-2xl sm:rounded-3xl p-5 sm:p-8">
        <header class="mb-6 flex justify-between items-center border-b-3 border-black pb-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-black uppercase">Pilih Kursi 🍿</h1>
                <p id="movieTitleDisplay" class="text-indigo-700 font-bold text-xs sm:text-sm mt-0.5">Memuat film...</p>
            </div>
            <a href="/" class="brutalist-btn px-3.5 py-2 bg-yellow-400 font-black text-xs uppercase rounded-xl">
                ← Kembali
            </a>
        </header>

        <form id="bookingForm" class="space-y-5">
            <div>
                <label class="block text-xs font-black uppercase tracking-wider mb-1">
                    Nama Pemesan: <span class="text-red-600">*</span>
                </label>
                <input type="text" id="customerName" required placeholder="Masukkan nama lengkap" class="brutalist-input w-full rounded-xl px-3.5 py-2.5 text-xs sm:text-sm font-bold">
            </div>

            <div class="space-y-4">
                <div class="w-full pt-2 pb-1 text-center">
                    <div class="curved-screen w-4/5 mx-auto pt-1.5 text-[10px] sm:text-xs font-black tracking-widest uppercase">
                        LAYAR BIOSKOP
                    </div>
                </div>

                <div class="bg-[#f4f4f0] p-3 sm:p-5 rounded-2xl border-3 border-black shadow-[3px_3px_0px_#000] overflow-x-auto">
                    <div id="seatGrid" class="flex flex-col gap-2.5 min-w-[320px] justify-center items-center"></div>
                </div>

                <div class="flex flex-wrap justify-center gap-4 text-xs font-bold pt-1">
                    <div class="flex items-center gap-1.5"><span class="w-4 h-4 bg-white border-2 border-black shadow-[2px_2px_0px_#000] rounded"></span> Tersedia</div>
                    <div class="flex items-center gap-1.5"><span class="w-4 h-4 bg-yellow-400 border-2 border-black shadow-[2px_2px_0px_#000] rounded"></span> Dipilih</div>
                    <div class="flex items-center gap-1.5"><span class="w-4 h-4 bg-red-500 border-2 border-black shadow-[2px_2px_0px_#000] rounded"></span> Dipesan</div>
                </div>
            </div>

            <div class="bg-cyan-100 border-3 border-black p-4 rounded-xl flex justify-between items-center shadow-[3px_3px_0px_#000]">
                <div>
                    <span class="text-xs font-black uppercase block">Kursi (<span id="countDisplay">0</span>):</span>
                    <span id="selectedSeatsDisplay" class="font-black text-indigo-700 text-xs sm:text-sm">-</span>
                </div>
                <div class="text-right">
                    <span class="text-xs font-black uppercase block">Total Harga:</span>
                    <span id="totalPriceDisplay" class="font-black text-emerald-800 text-sm sm:text-base">Rp 0</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="brutalist-btn w-full py-3.5 bg-[#7ec8e3] font-black text-xs sm:text-sm uppercase rounded-xl">
                Konfirmasi Pemesanan
            </button>
        </form>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed top-4 right-4 z-50 px-4 py-3 border-3 border-black shadow-[4px_4px_0px_#000] rounded-xl text-xs sm:text-sm font-black ${
                type === 'success' ? 'bg-emerald-300 text-black' : 'bg-red-400 text-black'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('movie') || 'Film Pilihan';
        document.getElementById('movieTitleDisplay').textContent = `Film: ${movieTitle}`;

        let moviePrice = 50000;
        let selectedSeats = [];
        let bookedSeats = [];

        async function initBookingPage() {
            try {
                const resMovies = await fetch('/api/movies');
                const movies = await resMovies.json();
                const currentMovie = movies.find(m => m.title.toLowerCase() === movieTitle.toLowerCase());
                if (currentMovie) moviePrice = Number(currentMovie.price || 50000);

                const resBookings = await fetch('/api/bookings');
                const bookings = await resBookings.json();
                bookings.forEach(b => {
                    if (b.movie_title.toLowerCase() === movieTitle.toLowerCase() && b.seats) {
                        bookedSeats.push(...b.seats.split(',').map(s => s.trim()));
                    }
                });

                renderSeats();
            } catch (err) {
                console.error("Error:", err);
            }
        }

        function renderSeats() {
            const seatGrid = document.getElementById('seatGrid');
            const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
            const seatsPerSide = 4;
            let html = '';

            rows.forEach((rowLetter) => {
                html += `<div class="flex items-center gap-2 sm:gap-3">`;
                html += `<span class="w-4 text-center text-xs font-black">${rowLetter}</span>`;
                
                html += `<div class="flex gap-1.5 sm:gap-2">`;
                for (let col = 1; col <= seatsPerSide; col++) {
                    html += createSeatButton(`${rowLetter}${col}`);
                }
                html += `</div><div class="w-4 sm:w-6"></div><div class="flex gap-1.5 sm:gap-2">`;
                for (let col = seatsPerSide + 1; col <= seatsPerSide * 2; col++) {
                    html += createSeatButton(`${rowLetter}${col}`);
                }
                html += `</div><span class="w-4 text-center text-xs font-black">${rowLetter}</span></div>`;
            });

            seatGrid.innerHTML = html;
            updateSummary();
        }

        function createSeatButton(seatCode) {
            const isBooked = bookedSeats.includes(seatCode);
            const isSelected = selectedSeats.includes(seatCode);

            let bgClass = "bg-white text-black border-2 border-black shadow-[2px_2px_0px_#000] hover:bg-slate-100 cursor-pointer";
            if (isBooked) {
                bgClass = "bg-red-500 text-white border-2 border-black opacity-80 cursor-not-allowed";
            } else if (isSelected) {
                bgClass = "bg-yellow-400 text-black font-black border-2 border-black shadow-[3px_3px_0px_#000] scale-105";
            }

            return `
                <button type="button" 
                    class="w-7 h-7 sm:w-8 sm:h-8 text-[10px] sm:text-xs font-black rounded transition-all flex items-center justify-center ${bgClass}"
                    ${isBooked ? 'disabled' : `onclick="toggleSeat('${seatCode}')"`}>
                    ${seatCode}
                </button>
            `;
        }

        window.toggleSeat = function(seatCode) {
            if (selectedSeats.includes(seatCode)) {
                selectedSeats = selectedSeats.filter(s => s !== seatCode);
            } else {
                selectedSeats.push(seatCode);
            }
            renderSeats();
        };

        function updateSummary() {
            const count = selectedSeats.length;
            document.getElementById('countDisplay').textContent = count;
            document.getElementById('selectedSeatsDisplay').textContent = count > 0 ? selectedSeats.join(', ') : '-';
            document.getElementById('totalPriceDisplay').textContent = `Rp ${(count * moviePrice).toLocaleString('id-ID')}`;
        }

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (selectedSeats.length === 0) {
                showToast("Pilih minimal 1 kursi!", "error");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Memproses...";

            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: document.getElementById('customerName').value,
                        movie_title: movieTitle,
                        seats: selectedSeats.join(', '),
                        total_price: selectedSeats.length * moviePrice
                    })
                });

                if (!response.ok) throw new Error("Gagal melakukan pemesanan.");

                showToast("Pemesanan tiket berhasil!");
                setTimeout(() => { window.location.href = '/'; }, 1500);
            } catch (err) {
                showToast(err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = "Konfirmasi Pemesanan";
            }
        });

        initBookingPage();
    </script>
</body>
</html>
