 <!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Kelola Film & Monitoring Kursi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }

    /* Menghilangkan panah naik/turun bawaan browser untuk input type="number" */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; border-radius: 8px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; border: 2px solid #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6366f1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10 custom-scrollbar relative">

  <!-- TOAST NOTIFICATION KUSTOM (Menggantikan Tooltip Kaku Browser) -->
  <div id="toast" class="fixed top-6 right-6 z-50 transform translate-x-full opacity-0 transition-all duration-300 ease-out flex items-center space-x-3 bg-slate-900 border border-slate-800 text-white px-5 py-4 rounded-2xl shadow-2xl">
    <div id="toast-icon" class="w-8 h-8 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-sm">✕</div>
    <div>
      <h4 id="toast-title" class="text-sm font-bold text-white">Peringatan</h4>
      <p id="toast-message" class="text-xs text-slate-400">Harap lengkapi semua kolom inputan.</p>
    </div>
  </div>
  
  <div class="max-w-4xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-2xl font-bold text-white">⚙️ Panel Admin Bioskop</h1>
        <p class="text-xs text-slate-400 mt-1">Kelola film dan pantau kursi yang sudah dipesan.</p>
      </div>
      <a href="/" class="text-sm font-semibold px-4 py-2.5 rounded-xl bg-slate-900 border border-slate-800 text-slate-300 hover:text-white transition-all">
        ← Ke Beranda Utama
      </a>
    </div>

    <!-- Grid Layout -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Form Tambah Film (Dengan novalidate agar tooltip kaku browser mati) -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 h-fit">
        <h2 class="text-lg font-bold text-white mb-4">Tambah Film Baru</h2>
        
        <form id="add-movie-form" class="space-y-4" novalidate>
          <div>
            <label class="block mb-1 text-xs font-semibold text-slate-300">Judul Film</label>
            <input type="text" id="title" placeholder="Contoh: Interstellar" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>
          
          <div>
            <label class="block mb-1 text-xs font-semibold text-slate-300">Harga (Rp)</label>
            <input type="number" id="price" placeholder="50000" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>
          
          <div>
            <label class="block mb-1 text-xs font-semibold text-slate-300">Total Kursi</label>
            <input type="number" id="seats" value="30" class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-indigo-500 transition-colors">
          </div>
          
          <!-- UI Upload Poster Kustom Modern (Dropzone) -->
          <div>
            <label class="block mb-1.5 text-xs font-semibold text-slate-300">Poster Film</label>
            <div class="relative">
              <input type="file" id="poster" accept="image/*" class="hidden" onchange="updateFileName(this)">
              <label for="poster" class="w-full flex items-center justify-between px-3.5 py-2.5 bg-slate-950 border border-slate-800 rounded-xl text-xs cursor-pointer hover:border-indigo-500 transition-all group">
                <span id="file-name-text" class="text-slate-500 truncate">Pilih berkas poster...</span>
                <span class="px-3 py-1 rounded-lg bg-slate-800 text-slate-300 group-hover:bg-indigo-600 group-hover:text-white font-semibold transition-all">
                  Cari File
                </span>
              </label>
            </div>
          </div>

          <button type="submit" id="submit-btn" class="w-full py-3 mt-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] text-white font-semibold text-sm shadow-lg shadow-indigo-600/25 transition-all">
            Simpan Film
          </button>
        </form>
      </div>

      <!-- Monitoring Kursi & Daftar Film Terpesan -->
      <div class="lg:col-span-2 space-y-6">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <h2 class="text-lg font-bold text-white mb-4">🪑 Monitoring Kursi Terisi per Film</h2>
          <div id="monitoring-container" class="space-y-4">
            <p class="text-slate-500 text-sm">Memuat data kursi...</p>
          </div>
        </div>

        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6">
          <h2 class="text-lg font-bold text-white mb-4">🎟️ Riwayat Transaksi Pemesanan</h2>
          <div id="history-container" class="space-y-3">
            <p class="text-slate-500 text-sm">Memuat riwayat...</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Fungsi Toast Notifikasi Kustom
    function showToast(title, message, isSuccess = false) {
      const toast = document.getElementById('toast');
      const toastTitle = document.getElementById('toast-title');
      const toastMessage = document.getElementById('toast-message');
      const toastIcon = document.getElementById('toast-icon');

      toastTitle.innerText = title;
      toastMessage.innerText = message;
      
      if (isSuccess) {
        toastIcon.className = "w-8 h-8 rounded-xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center font-bold text-sm";
        toastIcon.innerText = "✓";
      } else {
        toastIcon.className = "w-8 h-8 rounded-xl bg-rose-500/20 text-rose-400 flex items-center justify-center font-bold text-sm";
        toastIcon.innerText = "✕";
      }

      toast.classList.remove('translate-x-full', 'opacity-0');
      setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); }, 3500);
    }

    // Fungsi Update Teks Nama File
    function updateFileName(input) {
      const fileNameText = document.getElementById('file-name-text');
      if (input.files && input.files[0]) {
        fileNameText.innerText = input.files[0].name;
        fileNameText.classList.remove('text-slate-500');
        fileNameText.classList.add('text-indigo-400', 'font-semibold');
      } else {
        fileNameText.innerText = "Pilih berkas poster...";
        fileNameText.classList.remove('text-indigo-400', 'font-semibold');
        fileNameText.classList.add('text-slate-500');
      }
    }

    async function loadAdminData() {
      try {
        const resMovies = await fetch('/api/movies');
        const movies = await resMovies.json();
        
        const monitorContainer = document.getElementById('monitoring-container');
        monitorContainer.innerHTML = movies.map(m => `
          <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-4 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
              <h3 class="font-bold text-white text-sm">${m.title}</h3>
              <p class="text-xs text-slate-400 mt-1">Sisa Kursi: <span class="text-emerald-400 font-semibold">${m.seatsAvailable}</span></p>
            </div>
            <div class="text-left sm:text-right">
              <span class="text-[11px] text-slate-500 block mb-1">Kursi yang Sudah Dipesan:</span>
              <span class="text-xs font-bold px-3 py-1 rounded-lg bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 inline-block">
                ${m.bookedSeats && m.bookedSeats.length > 0 ? m.bookedSeats.join(', ') : 'Belum ada kursi terisi'}
              </span>
            </div>
          </div>
        `).join('');

        const resHistory = await fetch('/api/bookings');
        const history = await resHistory.json();
        const historyContainer = document.getElementById('history-container');

        if (history.length === 0) {
          historyContainer.innerHTML = `<p class="text-slate-500 text-sm">Belum ada transaksi pemesanan.</p>`;
          return;
        }

        historyContainer.innerHTML = history.reverse().map(h => `
          <div class="bg-slate-950 border border-slate-800/80 rounded-xl p-3.5 text-xs flex justify-between items-center">
            <div>
              <span class="font-bold text-white">${h.movieTitle}</span> (${h.showtime})
              <div class="text-slate-400 mt-0.5">Kursi: <span class="text-indigo-400 font-semibold">${h.seats}</span></div>
            </div>
            <div class="text-right text-slate-500 text-[11px]">
              ${h.bookingDate}
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
      }
    }

    // Handing Submit Form dengan Validasi Kustom Modern
    document.getElementById('add-movie-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const title = document.getElementById('title').value.trim();
      const price = document.getElementById('price').value.trim();
      const seats = document.getElementById('seats').value.trim();
      const posterFile = document.getElementById('poster').files[0];

      // Validasi Manual untuk Menggantikan Tooltip Kaku Browser
      if (!title) {
        showToast("Form Belum Lengkap", "Judul film tidak boleh kosong!", false);
        return;
      }
      if (!price || isNaN(price) || parseInt(price) <= 0) {
        showToast("Form Belum Lengkap", "Masukkan harga tiket yang valid!", false);
        return;
      }
      if (!seats || isNaN(seats) || parseInt(seats) <= 0) {
        showToast("Form Belum Lengkap", "Masukkan jumlah kursi yang valid!", false);
        return;
      }
      if (!posterFile) {
        showToast("Peringatan Poster", "Harap pilih berkas gambar poster terlebih dahulu!", false);
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerText = "Mengunggah...";

      const formData = new FormData();
      formData.append('title', title);
      formData.append('price', price);
      formData.append('seatsAvailable', seats);
      formData.append('poster', posterFile);

      try {
        const res = await fetch('/api/movies', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.success) {
          showToast("Berhasil!", "Film baru berhasil ditambahkan!", true);
          setTimeout(() => location.reload(), 1500);
        } else {
          showToast("Gagal", data.message || "Gagal mengunggah film.", false);
        }
      } catch (err) {
        showToast("Kesalahan", "Terjadi kesalahan koneksi sistem!", false);
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan Film";
      }
    });

    loadAdminData();
  </script>
</body>
</html>
