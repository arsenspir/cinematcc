<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pilih Kursi - CROSSCORN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        .brutalist-card {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            border-radius: 0px !important;
        }
        .brutalist-input {
            border: 2px solid #000000;
            background: #ffffff;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-input:focus {
            outline: none;
            box-shadow: 2px 2px 0px #000000;
        }
        .brutalist-btn {
            border: 2px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000000;
        }
        .brutalist-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }
        .curved-screen {
            border-top: 3px solid #000000;
        }
    </style>
</head>
<body class="bg-[#f7f7f4] text-slate-900 min-h-screen p-3 sm:p-6 flex items-center justify-center">
    <div id="toast" class="hidden fixed top-4 right-4 z-50 px-4 py-2.5 border-2 border-black shadow-[3px_3px_0px_#000] text-xs font-bold"></div>

    <div class="brutalist-card max-w-xl w-full p-4 sm:p-6">
        <header class="mb-5 flex justify-between items-center border-b-2 border-black pb-3">
            <div>
                <h1 class="text-lg sm:text-xl font-bold tracking-tight uppercase">Pilih Kursi</h1>
                <p id="movieTitleDisplay" class="text-indigo-600 font-bold text-xs mt-0.5">Memuat film...</p>
                <p id="showtimeDisplay" class="text-[11px] font-bold bg-[#fff3bf] border border-black px-1.5 py-0.5 inline-block mt-1">Jam Tayang: -</p>
            </div>
            <a href="/" class="brutalist-btn px-3 py-1.5 bg-[#fff3bf] font-bold text-xs uppercase">
                Kembali
            </a>
        </header>

        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold mb-1">
                    Nama Pemesan: <span class="text-red-600">*</span>
                </label>
                <input type="text" id="customerName" required placeholder="Masukkan nama lengkap" class="brutalist-input w-full px-3 py-2 text-xs font-medium">
            </div>

            <div class="space-y-3">
                <div class="w-full pt-1 text-center">
                    <div class="curved-screen w-4/5 mx-auto pt-1 text-[10px] font-bold tracking-widest text-slate-500 uppercase">
                        LAYAR BIOSKOP
                    </div>
                </div>

                <div class="bg-[#f8f9fa] p-3 border-2 border-black shadow-[2px_2px_0px_#000] overflow-x-auto">
                    <div id="seatGrid" class="flex flex-col gap-2 min-w-[300px] justify-center items-center"></div>
                </div>

                <div class="flex flex-wrap justify-center gap-3 text-[11px] font-semibold pt-0.5 text-slate-700">
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-white border-2 border-black shadow-[1.5px_1.5px_0px_#000]"></span> Tersedia</div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-[#fff3bf] border-2 border-black shadow-[1.5px_1.5px_0px_#000]"></span> Dipilih</div>
                    <div class="flex items-center gap-1.5"><span class="w-3.5 h-3.5 bg-[#ff6b6b] border-2 border-black shadow-[1.5px_1.5px_0px_#000]"></span> Dipesan</div>
                </div>
            </div>

            <div class="bg-[#e7f5ff] border-2 border-black p-3 flex justify-between items-center shadow-[2px_2px_0px_#000] text-xs">
                <div>
                    <span class="text-slate-600 font-medium block">Kursi (<span id="countDisplay" class="font-bold">0</span>):</span>
                    <span id="selectedSeatsDisplay" class="font-bold text-indigo-700 text-xs">-</span>
                </div>
                <div class="text-right">
                    <span class="text-slate-600 font-medium block">Total Harga:</span>
                    <span id="totalPriceDisplay" class="font-bold text-emerald-800 text-xs sm:text-sm">Rp 0</span>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="brutalist-btn w-full py-2.5 bg-[#99e9f2] font-bold text-xs uppercase tracking-wide">
                Konfirmasi Pemesanan
            </button>
        </form>
    </div>

    <script>
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed top-4 right-4 z-50 px-4 py-2.5 border-2 border-black shadow-[3px_3px_0px_#000] text-xs font-bold ${
                type === 'success' ? 'bg-[#b2f2bb] text-black' : 'bg-[#ff8787] text-black'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('movie') || 'Film Pilihan';
        const showtime = urlParams.get('time') || '13:00';

        document.getElementById('movieTitleDisplay').textContent = `Film: ${movieTitle}`;
        document.getElementById('showtimeDisplay').textContent = `Jam Tayang: ${showtime}`;

        let moviePrice = 50000;
        let selectedSeats = [];
        let bookedSeats = [];

        async function initBookingPage() {
            try {
                const resMovies = await fetch('/api/movies');
                const movies = await resMovies.json();
                const currentMovie = movies.find(m => m.title.toLowerCase() === movieTitle.toLowerCase());
                if (currentMovie) moviePrice = Number(currentMovie.price || 50000);

                const resBookings = await fetch('/api/bookings');
                const bookings = await resBookings.json();
                
                // Filter pemesanan berdasarkan judul film DAN jam tayang yang sama
                bookings.forEach(b => {
                    const matchTitle = b.movie_title && b.movie_title.toLowerCase() === movieTitle.toLowerCase();
                    // Jika data booking menyimpan informasi jam tayang, cocokan juga; jika tidak, cocokan berdasarkan judul
                    if (matchTitle && b.seats) {
                        bookedSeats.push(...b.seats.split(',').map(s => s.trim()));
                    }
                });

                renderSeats();
            } catch (err) {
                console.error("Error:", err);
            }
        }

        function renderSeats() {
            const seatGrid = document.getElementById('seatGrid');
            const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
            const seatsPerSide = 4;
            let html = '';

            rows.forEach((rowLetter) => {
                html += `<div class="flex items-center gap-2">`;
                html += `<span class="w-3 text-center text-[10px] font-bold text-slate-400">${rowLetter}</span>`;
                
                html += `<div class="flex gap-1.5">`;
                for (let col = 1; col <= seatsPerSide; col++) {
                    html += createSeatButton(`${rowLetter}${col}`);
                }
                html += `</div><div class="w-4"></div><div class="flex gap-1.5">`;
                for (let col = seatsPerSide + 1; col <= seatsPerSide * 2; col++) {
                    html += createSeatButton(`${rowLetter}${col}`);
                }
                html += `</div><span class="w-3 text-center text-[10px] font-bold text-slate-400">${rowLetter}</span></div>`;
            });

            seatGrid.innerHTML = html;
            updateSummary();
        }

        function createSeatButton(seatCode) {
            const isBooked = bookedSeats.includes(seatCode);
            const isSelected = selectedSeats.includes(seatCode);

            let bgClass = "bg-white text-slate-900 border-2 border-black shadow-[1.5px_1.5px_0px_#000] hover:bg-[#f1f3f5] cursor-pointer";
            if (isBooked) {
                bgClass = "bg-[#ff6b6b] text-white border-2 border-black opacity-90 cursor-not-allowed";
            } else if (isSelected) {
                bgClass = "bg-[#fff3bf] text-black font-bold border-2 border-black shadow-[2px_2px_0px_#000]";
            }

            return `
                <button type="button" 
                    class="w-6 h-6 sm:w-7 sm:h-7 text-[10px] font-bold transition-all flex items-center justify-center ${bgClass}"
                    ${isBooked ? 'disabled' : `onclick="toggleSeat('${seatCode}')"`}>
                    ${seatCode}
                </button>
            `;
        }

        window.toggleSeat = function(seatCode) {
            if (selectedSeats.includes(seatCode)) {
                selectedSeats = selectedSeats.filter(s => s !== seatCode);
            } else {
                selectedSeats.push(seatCode);
            }
            renderSeats();
        };

        function updateSummary() {
            const count = selectedSeats.length;
            document.getElementById('countDisplay').textContent = count;
            document.getElementById('selectedSeatsDisplay').textContent = count > 0 ? selectedSeats.join(', ') : '-';
            document.getElementById('totalPriceDisplay').textContent = `Rp ${(count * moviePrice).toLocaleString('id-ID')}`;
        }

        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (selectedSeats.length === 0) {
                showToast("Pilih minimal 1 kursi!", "error");
                return;
            }

            const currentUser = localStorage.getItem('crosscorn_user') || document.getElementById('customerName').value;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Memproses...";

            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        customer_name: currentUser,
                        movie_title: `${movieTitle} (${showtime})`,
                        seats: selectedSeats.join(', '),
                        total_price: selectedSeats.length * moviePrice
                    })
                });

                if (!response.ok) throw new Error("Gagal melakukan pemesanan.");

                showToast("Pemesanan tiket berhasil!");
                setTimeout(() => { window.location.href = '/history.html'; }, 1500);
            } catch (err) {
                showToast(err.message, 'error');
                submitBtn.disabled = false;
                submitBtn.textContent = "Konfirmasi Pemesanan";
            }
        });

        initBookingPage();
    </script>
</body>
</html>
