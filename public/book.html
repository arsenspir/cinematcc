<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesan Tiket - Cinematcc</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10 flex items-center justify-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-xl">
        <header class="mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold">Pesan Tiket Bioskop</h1>
                <p id="movieTitleDisplay" class="text-indigo-400 text-sm font-medium mt-1">Memuat film...</p>
            </div>
            <a href="/" class="text-xs text-slate-400 hover:text-white transition">← Kembali</a>
        </header>

        <form id="bookingForm" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Nama Pemesan</label>
                <input type="text" id="customerName" required placeholder="Masukkan nama lengkap" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Nomor Kursi (Contoh: A1, A2)</label>
                <input type="text" id="seatNumber" required placeholder="A1" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Total Harga (Rp)</label>
                <input type="number" id="totalPrice" required placeholder="50000" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
            </div>
            <button type="submit" id="submitBtn" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-sm transition shadow-lg shadow-indigo-600/20">
                Konfirmasi Pemesanan
            </button>
        </form>
    </div>

    <script>
        // Ambil parameter judul film dari URL (contoh: ?movie=Interstellar)
        const urlParams = new URLSearchParams(window.location.search);
        const movieTitle = urlParams.get('movie') || 'Film Pilihan';
        document.getElementById('movieTitleDisplay').textContent = `Film: ${movieTitle}`;

        // Kirim data pemesanan ke API /api/bookings
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');

            const bookingData = {
                customer_name: document.getElementById('customerName').value,
                movie_title: movieTitle,
                seats: document.getElementById('seatNumber').value,
                total_price: Number(document.getElementById('totalPrice').value)
            };

            submitBtn.disabled = true;
            submitBtn.textContent = "Memproses...";

            try {
                const response = await fetch('/api/bookings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });

                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Gagal melakukan pemesanan.");

                alert("Tiket berhasil dipesan!");
                window.location.href = '/';
            } catch (err) {
                alert("Terjadi kesalahan: " + err.message);
                submitBtn.disabled = false;
                submitBtn.textContent = "Konfirmasi Pemesanan";
            }
        });
    </script>
</body>
</html>
