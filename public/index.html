<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTicket - Beranda Bioskop</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6 sm:p-10">
    <div class="max-w-6xl mx-auto">
        <!-- Header Beranda -->
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold">CineTicket - Daftar Film</h1>
                <p class="text-slate-400 text-sm mt-1">Pilih film favoritmu dan pesan tiket sekarang.</p>
            </div>
            <a href="/admin.html" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-sm transition font-medium">Panel Admin →</a>
        </header>

        <!-- Container Daftar Film -->
        <div id="moviesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="col-span-full text-center text-slate-400 py-10">Memuat daftar film...</div>
        </div>
    </div>

    <!-- Script JavaScript untuk Ambil Data Film -->
    <script>
        async function fetchMovies() {
            const container = document.getElementById('moviesContainer');
            try {
                const response = await fetch('/api/movies');
                const movies = await response.json();

                if (!response.ok) throw new Error(movies.error || "Gagal mengambil data film.");

                if (movies.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">Belum ada film yang tersedia saat ini.</div>`;
                    return;
                }

                container.innerHTML = movies.map(m => {
                    const totalSeats = m.seats !== undefined ? m.seats : (m.total_seats || 30);
                    const isAvailable = totalSeats > 0;

                    return `
                        <div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-xl flex flex-col justify-between">
                            <div>
                                <div class="h-64 w-full bg-slate-800 relative overflow-hidden">
                                    <img src="${m.image_url || 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${m.title}" class="w-full h-full object-cover">
                                    <span class="absolute top-3 right-3 px-2.5 py-1 bg-slate-900/80 backdrop-blur text-xs font-semibold rounded-full ${isAvailable ? 'text-emerald-400' : 'text-red-400'}">
                                        ${isAvailable ? `${totalSeats} Kursi` : 'Habis'}
                                    </span>
                                </div>
                                <div class="p-5">
                                    <h3 class="text-lg font-bold text-slate-100">${m.title}</h3>
                                    <p class="text-sm text-slate-400 mt-1">Rp ${Number(m.price || 0).toLocaleString('id-ID')} / tiket</p>
                                </div>
                            </div>
                            <div class="p-5 pt-0">
                                ${isAvailable ? `
                                    <button onclick="window.location.href='/book.html?movie=${encodeURIComponent(m.title)}'" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg font-medium text-sm transition shadow-lg shadow-indigo-600/20">
                                        Pesan Tiket
                                    </button>
                                ` : `
                                    <button disabled class="w-full py-2.5 bg-slate-800 text-slate-500 rounded-lg font-medium text-sm cursor-not-allowed">
                                        Tiket Habis
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = `<div class="col-span-full text-center text-red-400 py-10">Gagal memuat film: ${err.message}</div>`;
            }
        }

        fetchMovies();
    </script>
</body>
</html>
