<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CROSSCORN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        .brutalist-card {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            border-radius: 0px !important;
        }
        .brutalist-input {
            border: 2px solid #000000;
            background: #ffffff;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-input:focus {
            outline: none;
            box-shadow: 2px 2px 0px #000000;
        }
        .brutalist-btn {
            border: 2px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000000;
        }
    </style>
</head>
<body class="bg-[#f7f7f4] text-slate-900 min-h-screen flex items-center justify-center p-4">
    <div id="toast" class="hidden fixed top-4 right-4 z-50 px-4 py-2.5 border-2 border-black shadow-[3px_3px_0px_#000] text-xs font-bold"></div>

    <div class="brutalist-card max-w-md w-full p-6 sm:p-8">
        <div class="text-center mb-6">
            <div class="inline-block bg-[#fff3bf] border-2 border-black px-3 py-1 shadow-[2px_2px_0px_#000] mb-2">
                <span class="text-lg font-bold">🍿 CROSSCORN</span>
            </div>
            <h1 class="text-2xl font-bold tracking-tight">Masuk Akun</h1>
            <p class="text-xs text-slate-600 mt-1">Masukkan nama akun atau email untuk melihat tiketmu.</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-bold mb-1">Nama Pengguna / Email: <span class="text-red-600">*</span></label>
                <input type="text" id="usernameInput" required placeholder="Contoh: budi_cinema" class="brutalist-input w-full px-3 py-2 text-xs font-medium">
            </div>

            <button type="submit" class="brutalist-btn w-full py-2.5 bg-[#99e9f2] font-bold text-xs uppercase tracking-wide">
                Masuk / Lanjutkan
            </button>
        </form>

        <div class="mt-6 text-center">
            <a href="/" class="text-xs font-bold text-indigo-600 underline">← Kembali ke Beranda</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const val = document.getElementById('usernameInput').value.trim();
            if(!val) return;
            
            // Simpan sesi user ke localStorage sederhana
            localStorage.setItem('crosscorn_user', val);
            
            const toast = document.getElementById('toast');
            toast.textContent = `Berhasil masuk sebagai ${val}!`;
            toast.className = "fixed top-4 right-4 z-50 px-4 py-2.5 border-2 border-black shadow-[3px_3px_0px_#000] text-xs font-bold bg-[#b2f2bb]";
            toast.classList.remove('hidden');

            setTimeout(() => {
                window.location.href = '/';
            }, 1200);
        });
    </script>
</body>
</html>
