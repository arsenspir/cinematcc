<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CROSSCORN - Beranda Bioskop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            letter-spacing: -0.01em;
        }
        .brutalist-card {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-card:hover {
            transform: translate(-1px, -1px);
            box-shadow: 6px 6px 0px #000000;
        }
        .brutalist-btn {
            border: 2px solid #000000;
            box-shadow: 3px 3px 0px #000000;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 4px 4px 0px #000000;
        }
        .brutalist-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000000;
        }
    </style>
</head>
<body class="bg-[#f7f7f4] text-slate-900 min-h-screen p-4 sm:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header dengan Judul, Tagline, dan Menu di Tengah -->
        <header class="mb-8 bg-[#fff3bf] brutalist-card p-6 text-center space-y-4">
            <div class="max-w-xl mx-auto">
                <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight uppercase">CROSSCORN</h1>
                <p class="text-slate-700 font-medium text-xs sm:text-sm mt-1">Pilih film favoritmu, lihat sinopsis, dan amankan kursimu sekarang</p>
            </div>
            
            <div id="userNavArea" class="flex flex-wrap items-center justify-center gap-2 pt-1">
                <!-- Navigasi User / Login / Tiket & Admin dirender di tengah -->
            </div>
        </header>

        <!-- Container Daftar Film -->
        <div id="moviesContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="col-span-full text-center text-xs font-semibold py-10">Memuat daftar film...</div>
        </div>
    </div>

    <!-- Modal Detail Film -->
    <div id="movieModal" class="hidden fixed inset-0 z-50 bg-black/30 backdrop-blur-xs flex items-center justify-center p-4">
        <div class="brutalist-card max-w-md w-full overflow-hidden relative bg-white">
            <button onclick="closeMovieModal()" class="absolute top-3 right-3 z-10 w-7 h-7 bg-[#ff6b6b] text-white border-2 border-black font-bold text-xs flex items-center justify-center shadow-[2px_2px_0px_#000]">
                X
            </button>
            <div class="h-52 sm:h-60 w-full bg-[#f1f3f5] border-b-2 border-black relative">
                <img id="modalImage" src="" alt="Poster" class="w-full h-full object-cover">
            </div>
            <div class="p-5 space-y-3">
                <div>
                    <h2 id="modalTitle" class="text-xl font-bold tracking-tight text-slate-900"></h2>
                    <p id="modalPrice" class="text-indigo-600 font-bold text-xs mt-0.5"></p>
                </div>
                <div class="grid grid-cols-2 gap-2 bg-[#f8f9fa] border-2 border-black p-3 shadow-[2px_2px_0px_#000] text-[11px]">
                    <div>
                        <span class="text-slate-500 block">Durasi</span>
                        <span id="modalDuration" class="font-bold text-slate-900">120 Menit</span>
                    </div>
                    <div>
                        <span class="text-slate-500 block">Kursi Tersedia</span>
                        <span id="modalSeats" class="font-bold text-emerald-700">30 Kursi</span>
                    </div>
                </div>
                <div>
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Jadwal Tayang</h3>
                    <p id="modalSchedule" class="text-xs font-bold text-indigo-700 bg-[#e7f5ff] p-2 border border-black mb-2">
                        Belum ada jadwal.
                    </p>
                </div>
                <div>
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500 mb-1">Sinopsis</h3>
                    <p id="modalSynopsis" class="text-xs text-slate-700 leading-relaxed font-normal">
                        Sinopsis belum tersedia.
                    </p>
                </div>
                <div id="modalAction" class="pt-1"></div>
            </div>
        </div>
    </div>

    <script>
        let allMovies = [];

        function initUserNav() {
            const userNavArea = document.getElementById('userNavArea');
            const currentUser = localStorage.getItem('crosscorn_user');

            let html = '';
            if (currentUser) {
                html += `
                    <a href="/history.html" class="brutalist-btn px-3 py-1.5 bg-[#d0ebff] font-bold text-xs">
                        Tiket Saya (${currentUser})
                    </a>
                    <button onclick="logoutUser()" class="brutalist-btn px-2.5 py-1.5 bg-[#ff8787] text-white font-bold text-xs">
                        Keluar
                    </button>
                `;
            } else {
                html += `
                    <a href="/login.html" class="brutalist-btn px-3 py-1.5 bg-[#99e9f2] font-bold text-xs uppercase tracking-wide">
                        Login
                    </a>
                `;
            }
            html += `
                <a href="/admin.html" class="brutalist-btn px-3 py-1.5 bg-white font-semibold text-xs uppercase tracking-wide">
                    Admin Panel
                </a>
            `;
            userNavArea.innerHTML = html;
        }

        function logoutUser() {
            localStorage.removeItem('crosscorn_user');
            initUserNav();
        }

        async function fetchMovies() {
            const container = document.getElementById('moviesContainer');
            try {
                const response = await fetch('/api/movies');
                allMovies = await response.json();

                if (!response.ok) throw new Error("Gagal mengambil data film.");

                if (allMovies.length === 0) {
                    container.innerHTML = `<div class="col-span-full text-center text-xs font-semibold py-8 brutalist-card p-6 bg-white">Belum ada film yang tersedia saat ini.</div>`;
                    return;
                }

                container.innerHTML = allMovies.map(m => {
                    const totalSeats = m.seats !== undefined ? m.seats : (m.total_seats || 30);
                    const isAvailable = totalSeats > 0;
                    const scheduleText = m.schedule || '13:00, 16:00, 19:00';

                    return `
                        <div class="brutalist-card overflow-hidden flex flex-col justify-between cursor-pointer group bg-white" onclick="openMovieModal('${m.id}')">
                            <div>
                                <div class="h-56 w-full bg-[#f1f3f5] border-b-2 border-black relative overflow-hidden">
                                    <img src="${m.image_url || 'https://via.placeholder.com/300x450?text=No+Image'}" alt="${m.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-200">
                                    <span class="absolute top-2.5 right-2.5 px-2.5 py-0.5 bg-white border-2 border-black font-bold text-[10px] shadow-[2px_2px_0px_#000] ${isAvailable ? 'text-emerald-700' : 'text-red-600'}">
                                        ${isAvailable ? `${totalSeats} Kursi` : 'Habis'}
                                    </span>
                                </div>
                                <div class="p-4 space-y-1">
                                    <h3 class="text-base font-bold text-slate-900 tracking-tight leading-snug">${m.title}</h3>
                                    <p class="text-xs font-bold text-indigo-600">Rp ${Number(m.price || 0).toLocaleString('id-ID')}</p>
                                    <p class="text-[10px] bg-[#fff3bf] border border-black px-1.5 py-0.5 inline-block font-bold">Jadwal: ${scheduleText}</p>
                                    <p class="text-[11px] font-medium text-slate-500 pt-1 underline">Lihat Detail & Sinopsis</p>
                                </div>
                            </div>
                            <div class="p-4 pt-0">
                                ${isAvailable ? `
                                    <button onclick="event.stopPropagation(); window.location.href='/book.html?movie=${encodeURIComponent(m.title)}'" class="w-full py-2 bg-[#99e9f2] brutalist-btn font-bold text-xs tracking-wide">
                                        Pesan Tiket
                                    </button>
                                ` : `
                                    <button disabled class="w-full py-2 bg-[#e9ecef] border-2 border-black font-semibold text-xs text-slate-400 cursor-not-allowed">
                                        Tiket Habis
                                    </button>
                                `}
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Error:", err);
                container.innerHTML = `<div class="col-span-full text-center text-xs font-semibold text-red-600 py-8 brutalist-card bg-white">Gagal memuat film: ${err.message}</div>`;
            }
        }

        function openMovieModal(movieId) {
            const movie = allMovies.find(m => m.id == movieId);
            if (!movie) return;

            const totalSeats = movie.seats !== undefined ? movie.seats : (movie.total_seats || 30);
            const isAvailable = totalSeats > 0;

            document.getElementById('modalImage').src = movie.image_url || 'https://via.placeholder.com/300x450?text=No+Image';
            document.getElementById('modalTitle').textContent = movie.title;
            document.getElementById('modalPrice').textContent = `Rp ${Number(movie.price || 0).toLocaleString('id-ID')} / tiket`;
            document.getElementById('modalSeats').textContent = `${totalSeats} Kursi Tersedia`;
            document.getElementById('modalSchedule').textContent = movie.schedule || '13:00, 16:00, 19:00';
            document.getElementById('modalSynopsis').textContent = movie.synopsis || `Film ${movie.title} menghadirkan pengalaman sinematik yang memukau. Pilih kursi terbaikmu sekarang!`;

            const actionContainer = document.getElementById('modalAction');
            if (isAvailable) {
                actionContainer.innerHTML = `
                    <button onclick="window.location.href='/book.html?movie=${encodeURIComponent(movie.title)}'" class="w-full py-2.5 bg-[#99e9f2] brutalist-btn font-bold text-xs tracking-wide">
                        Pesan Kursi Sekarang
                    </button>
                `;
            } else {
                actionContainer.innerHTML = `
                    <button disabled class="w-full py-2.5 bg-[#e9ecef] border-2 border-black font-semibold text-xs text-slate-400 cursor-not-allowed">
                        Tiket Habis
                    </button>
                `;
            }

            document.getElementById('movieModal').classList.remove('hidden');
        }

        function closeMovieModal() {
            document.getElementById('movieModal').classList.add('hidden');
        }

        window.onclick = function(event) {
            const modal = document.getElementById('movieModal');
            if (event.target === modal) closeMovieModal();
        }

        initUserNav();
        fetchMovies();
    </script>
</body>
</html>
