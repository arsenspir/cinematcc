<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - CROSSCORN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.01em;
        }
        .brutalist-card {
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 5px 5px 0px #000000;
            border-radius: 0px !important;
        }
        .brutalist-input {
            border: 2px solid #000000;
            background: #ffffff;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-input:focus {
            outline: none;
            box-shadow: 2px 2px 0px #000000;
        }
        .brutalist-btn {
            border: 2px solid #000000;
            box-shadow: 2.5px 2.5px 0px #000000;
            transition: all 0.1s ease;
            border-radius: 0px !important;
        }
        .brutalist-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3.5px 3.5px 0px #000000;
        }
    </style>
</head>
<body class="bg-[#f7f7f4] text-slate-900 min-h-screen p-4 sm:p-8">
    <div class="max-w-5xl mx-auto">
        <!-- Header di Tengah, Tanpa Emoji/Simbol Panah -->
        <header class="mb-6 bg-[#ffdeeb] brutalist-card p-6 text-center space-y-3">
            <div class="max-w-xl mx-auto">
                <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight uppercase">PANEL ADMIN CROSSCORN</h1>
                <p class="font-medium text-xs text-slate-700 mt-1">Kelola film, atur genre, dan transaksi pemesanan</p>
            </div>
            <div>
                <a href="/" class="brutalist-btn px-3 py-1.5 bg-[#fff3bf] font-bold text-xs uppercase">
                    Kembali ke Beranda
                </a>
            </div>
        </header>

        <div id="toast" class="hidden fixed top-5 right-5 z-50 px-4 py-2.5 border-2 border-black shadow-[3px_3px_0px_#000] text-xs font-bold"></div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form Tambah/Edit Film -->
            <div class="brutalist-card p-5 h-fit bg-white">
                <h2 id="formTitle" class="text-sm font-bold uppercase tracking-wide mb-3">Tambah Film Baru</h2>
                <form id="addMovieForm" class="space-y-3">
                    <input type="hidden" id="editMovieId">
                    <div>
                        <label class="block text-xs font-bold mb-1">Judul Film: <span class="text-red-600">*</span></label>
                        <input type="text" id="movieTitle" required placeholder="Contoh: Interstellar" class="brutalist-input w-full px-3 py-1.5 text-xs font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Harga Tiket (Rp): <span class="text-red-600">*</span></label>
                        <input type="number" id="moviePrice" required placeholder="50000" class="brutalist-input w-full px-3 py-1.5 text-xs font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Jumlah Total Kursi: <span class="text-red-600">*</span></label>
                        <input type="number" id="movieSeats" required value="48" class="brutalist-input w-full px-3 py-1.5 text-xs font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Genre Film (Contoh: Sci-Fi, Drama):</label>
                        <input type="text" id="movieGenre" placeholder="Sci-Fi, Adventure, Drama" class="brutalist-input w-full px-3 py-1.5 text-xs font-medium">
                    </div>
                    <div>
                        <label class="block text-xs font-bold mb-1">Poster Film (File Lokal)</label>
                        <input type="file" id="movieFile" accept="image/*" class="w-full text-xs font-semibold file:mr-2 file:py-1 file:px-2.5 file:border-2 file:border-black file:bg-[#fff3bf] file:font-bold cursor-pointer">
                    </div>
                    <div class="flex gap-2 pt-1">
                        <button type="submit" id="submitBtn" class="brutalist-btn flex-1 py-2 bg-[#99e9f2] font-bold text-xs uppercase tracking-wide">
                            Simpan Film
                        </button>
                        <button type="button" id="cancelEditBtn" onclick="resetForm()" class="hidden brutalist-btn px-3 py-2 bg-[#ff8787] text-white font-bold text-xs uppercase">
                            Batal
                        </button>
                    </div>
                </form>
            </div>

            <!-- Tabel Data -->
            <div class="lg:col-span-2 space-y-6">
                <!-- Daftar Film -->
                <div class="brutalist-card overflow-hidden bg-white">
                    <div class="p-3 bg-[#fff3bf] border-b-2 border-black font-bold uppercase text-xs">Daftar Film & Pengaturan Genre</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-[#f8f9fa] border-b-2 border-black text-[11px] font-bold text-slate-700 uppercase">
                                    <th class="p-2.5">Judul & Genre</th>
                                    <th class="p-2.5">Harga</th>
                                    <th class="p-2.5">Kursi</th>
                                    <th class="p-2.5 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="moviesTableBody" class="divide-y-2 divide-black text-xs font-medium">
                                <tr><td colspan="4" class="p-3 text-center text-xs">Memuat film...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Daftar Transaksi -->
                <div class="brutalist-card overflow-hidden bg-white">
                    <div class="p-3 bg-[#b2f2bb] border-b-2 border-black font-bold uppercase text-xs">Daftar Pemesanan Tiket</div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-[#f8f9fa] border-b-2 border-black text-[11px] font-bold text-slate-700 uppercase">
                                    <th class="p-2.5">Nama</th>
                                    <th class="p-2.5">Film</th>
                                    <th class="p-2.5">Kursi</th>
                                    <th class="p-2.5">Total</th>
                                    <th class="p-2.5 text-center">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="bookingsTableBody" class="divide-y-2 divide-black text-xs font-medium">
                                <tr><td colspan="5" class="p-3 text-center text-xs">Memuat pesanan...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cachedMovies = [];

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `fixed top-5 right-5 z-50 px-4 py-2.5 border-2 border-black shadow-[3px_3px_0px_#000] text-xs font-bold ${
                type === 'success' ? 'bg-[#b2f2bb] text-black' : 'bg-[#ff8787] text-black'
            }`;
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }

        async function fetchAdminData() {
            const moviesBody = document.getElementById('moviesTableBody');
            const bookingsBody = document.getElementById('bookingsTableBody');

            try {
                const resMovies = await fetch('/api/movies');
                cachedMovies = await resMovies.json();
                
                moviesBody.innerHTML = cachedMovies.length === 0 
                    ? `<tr><td colspan="4" class="p-3 text-center text-xs">Belum ada film.</td></tr>`
                    : cachedMovies.map(m => `
                        <tr>
                            <td class="p-2.5 space-y-1">
                                <strong class="uppercase text-xs block">${m.title}</strong>
                                <span class="text-[10px] bg-[#fff3bf] border border-black px-1.5 py-0.5 font-bold inline-block">Genre: ${m.genre || m.schedule || 'Drama, Action'}</span>
                            </td>
                            <td class="p-2.5">Rp ${Number(m.price || 0).toLocaleString('id-ID')}</td>
                            <td class="p-2.5"><span class="px-2 py-0.5 bg-[#fff3bf] border-2 border-black text-[10px] font-bold">${m.seats !== undefined ? m.seats : 48}</span></td>
                            <td class="p-2.5 text-center space-x-1">
                                <button onclick="editMovie('${m.id}')" class="px-2 py-0.5 bg-[#7ec8e3] text-black brutalist-btn text-[10px] font-bold">Edit</button>
                                <button onclick="deleteMovie('${m.id}')" class="px-2 py-0.5 bg-[#ff6b6b] text-white brutalist-btn text-[10px] font-bold">Hapus</button>
                            </td>
                        </tr>
                    `).join('');

                const resBookings = await fetch('/api/bookings');
                const bookings = await resBookings.json();
                bookingsBody.innerHTML = bookings.length === 0 
                    ? `<tr><td colspan="5" class="p-3 text-center text-xs">Belum ada transaksi.</td></tr>`
                    : bookings.map(b => `
                        <tr>
                            <td class="p-2.5 font-bold text-xs">${b.customer_name || '-'}</td>
                            <td class="p-2.5 uppercase">${b.movie_title || '-'}</td>
                            <td class="p-2.5"><span class="px-2 py-0.5 bg-[#e7f5ff] border-2 border-black text-[10px] font-bold">${b.seats || '-'}</span></td>
                            <td class="p-2.5">Rp ${Number(b.total_price || 0).toLocaleString('id-ID')}</td>
                            <td class="p-2.5 text-center">
                                <button onclick="deleteBooking('${b.id}')" class="px-2 py-0.5 bg-[#ff6b6b] text-white brutalist-btn text-[10px] font-bold">Hapus</button>
                            </td>
                        </tr>
                    `).join('');
            } catch (err) {
                console.error("Gagal memuat data:", err);
            }
        }

        function editMovie(id) {
            const movie = cachedMovies.find(m => m.id == id);
            if(!movie) return;

            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('movieTitle').value = movie.title;
            document.getElementById('moviePrice').value = movie.price;
            document.getElementById('movieSeats').value = movie.seats !== undefined ? movie.seats : 48;
            document.getElementById('movieGenre').value = movie.genre || movie.schedule || '';
            
            document.getElementById('formTitle').textContent = "Edit Film & Genre";
            document.getElementById('submitBtn').textContent = "Perbarui Film";
            document.getElementById('cancelEditBtn').classList.remove('hidden');
        }

        function resetForm() {
            document.getElementById('addMovieForm').reset();
            document.getElementById('editMovieId').value = "";
            document.getElementById('formTitle').textContent = "Tambah Film Baru";
            document.getElementById('submitBtn').textContent = "Simpan Film";
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        async function deleteMovie(id) {
            if (!confirm("Hapus film ini?")) return;
            try {
                const res = await fetch(`/api/movies?id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Gagal menghapus.");
                showToast("Film berhasil dihapus!");
                fetchAdminData();
            } catch (err) { showToast(err.message, 'error'); }
        }

        async function deleteBooking(id) {
            if (!confirm("Hapus pesanan ini? Kursi akan dikembalikan.")) return;
            try {
                const res = await fetch(`/api/bookings?id=${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error("Gagal menghapus.");
                showToast("Pesanan dihapus & kursi dikembalikan!");
                fetchAdminData();
            } catch (err) { showToast(err.message, 'error'); }
        }

        document.getElementById('addMovieForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const editId = document.getElementById('editMovieId').value;
            const submitBtn = document.getElementById('submitBtn');
            const fileInput = document.getElementById('movieFile');
            let imageUrl = "https://via.placeholder.com/300x450?text=No+Image";

            if(editId) {
                const existing = cachedMovies.find(m => m.id == editId);
                if(existing) imageUrl = existing.image_url;
            }

            const processSubmit = async (finalImageUrl) => {
                const movieData = {
                    title: document.getElementById('movieTitle').value,
                    price: Number(document.getElementById('moviePrice').value),
                    seats: Number(document.getElementById('movieSeats').value),
                    genre: document.getElementById('movieGenre').value,
                    image_url: finalImageUrl
                };

                submitBtn.disabled = true;
                submitBtn.textContent = "Menyimpan...";

                try {
                    let response;
                    if(editId) {
                        response = await fetch(`/api/movies?id=${editId}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(movieData)
                        });
                    } else {
                        response = await fetch('/api/movies', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(movieData)
                        });
                    }

                    if (!response.ok) throw new Error("Gagal menyimpan data film.");
                    showToast(editId ? "Film berhasil diperbarui!" : "Film berhasil ditambahkan!");
                    resetForm();
                    fetchAdminData();
                } catch (err) {
                    showToast(err.message, 'error');
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = editId ? "Perbarui Film" : "Simpan Film";
                }
            };

            // Kompresi otomatis gambar untuk mencegah error 413 Content Too Large
            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 500;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        processSubmit(compressedDataUrl);
                    }
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSubmit(imageUrl);
            }
        });

        fetchAdminData();
    </script>
</body>
</html>
